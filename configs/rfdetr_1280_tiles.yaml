input_manifest: Data/Frames/frames_manifest.csv
artifact_directory: Data/Labels/proposals
run_id: 20260922_rfdetr_1280_tiles
device: cuda:0
batch_size: 1

output_classes:
  - car
  - motorcycle
  - truck

postprocessing:
  cross_class_conflict_iou: 0.85
  duplicate_car_iou: 0.85
  duplicate_truck_containment: 0.80
  tile_nms_iou: 0.60
  convert_bus_to_truck: true
  remove_truck_from_source_videos:
    - train_B.mp4

teachers:
  - name: rfdetr_large
    checkpoint: rfdetr-large
    input_size_pixels: 704
    tiling:
      tile_size_pixels: 1280
      tile_overlap: 0.20
    confidence_threshold: 0.15
    precision: fp16
